<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les lettres en vadrouille</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Playwrite+FR+Moderne&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#dcefff;
    --sky-deep:#b9dcfb;
    --ink:#23325c;
    --ink-soft:#5a6a92;
    --white:#ffffff;
    --sun:#ffc93c;
    --go:#4cc38a;
    --red:#ff6b6b;
    --coral:#ffab8f;
    --mint:#97e6c4;
    --blue:#9fd2ff;
    --lilac:#cfbfff;
    --ui:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
    --letters:'Andika','Comic Sans MS','Segoe UI',system-ui,sans-serif;
    --cursive:'Playwrite FR Moderne','Segoe Script','Brush Script MT',cursive;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(circle at 12% 18%, #ffffff 0 60px, transparent 61px),
      radial-gradient(circle at 18% 16%, #ffffff 0 44px, transparent 45px),
      radial-gradient(circle at 88% 10%, #ffffff 0 50px, transparent 51px),
      radial-gradient(circle at 93% 13%, #ffffff 0 36px, transparent 37px),
      var(--sky);
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--ui);
    padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  [hidden]{display:none !important}
  .wrap{max-width:1000px;margin:0 auto;padding:14px 0 40px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-size:clamp(1.6rem,5vw,2.6rem);font-weight:800;margin:0;letter-spacing:.5px}
  .top-actions{display:flex;gap:10px;align-items:center}
  .stars{background:var(--white);border-radius:999px;padding:6px 16px;font-size:1.4rem;font-weight:800;box-shadow:0 4px 0 var(--sky-deep)}
  .icon-btn{font-size:1.5rem;width:52px;height:52px;border:none;border-radius:50%;background:var(--white);box-shadow:0 4px 0 var(--sky-deep);cursor:pointer}

  .panel{background:var(--white);border-radius:24px;padding:18px;margin-top:16px;box-shadow:0 6px 0 var(--sky-deep)}
  label{font-size:1.15rem;font-weight:700;display:block;margin-bottom:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input{flex:1 1 220px;min-width:0;font:700 clamp(1.6rem,5vw,2.2rem) var(--letters);padding:10px 16px;border:3px solid var(--sky-deep);border-radius:16px;color:var(--ink);background:var(--white)}
  input:focus{outline:none;border-color:var(--ink)}
  .btn{font:800 1.15rem var(--ui);border:none;border-radius:16px;padding:10px 18px;background:var(--white);color:var(--ink);box-shadow:0 4px 0 var(--sky-deep);cursor:pointer;touch-action:manipulation}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sky-deep)}
  .btn.big{font-size:1.35rem;padding:14px 22px}
  .btn.go{background:var(--go);color:#fff;box-shadow:0 4px 0 #2f9a68}
  .btn.hint{background:var(--sun);box-shadow:0 4px 0 #d9a21c;display:inline-flex;align-items:center;gap:10px}
  .btn.hint .cost{display:inline-flex;align-items:center;gap:2px;background:var(--white);border-radius:999px;padding:0 10px;font-size:1.15rem;color:#d64545}
  .stars{position:relative}
  .stars.hit{animation:starsHit .5s}
  .lost{position:fixed;z-index:120;pointer-events:none;font:800 1.8rem var(--ui);color:#d64545;display:flex;align-items:center;gap:2px;
        animation:lost 1.3s ease-out forwards}
  @keyframes starsHit{0%,100%{transform:translateX(0);background:var(--white)}20%,60%{transform:translateX(-7px);background:#ffd6d6}40%,80%{transform:translateX(7px);background:#ffd6d6}}
  @keyframes lost{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(10px) scale(1.2)}100%{opacity:0;transform:translateY(70px) scale(1)}}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .msg{min-height:1.4em;margin:6px 2px 0;color:#d64545;font-weight:700}
  .tools{margin-top:4px}
  .seg{display:inline-flex;background:var(--sky);border-radius:14px;padding:4px;gap:4px}
  .seg button{font:800 1.05rem var(--ui);border:none;background:transparent;border-radius:10px;padding:6px 12px;color:var(--ink-soft);cursor:pointer;touch-action:manipulation}
  .seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 2px 0 var(--sky-deep)}
  .seg button.cur{font-family:var(--cursive);font-weight:400;font-size:.9rem}
  .history{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .history:empty{display:none}
  .chip{font:700 1rem var(--letters);background:var(--sky);border:none;border-radius:999px;padding:5px 12px;color:var(--ink);cursor:pointer}

  /* Images à choisir */
  .picker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .picker h2{margin:0;font-size:1.4rem}
  .pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px}
  .pic{position:relative;background:var(--sky);border:none;border-radius:22px;padding:12px 6px 8px;box-shadow:0 5px 0 var(--sky-deep);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation;color:var(--ink)}
  .pic:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sky-deep)}
  .pic .emo{font-size:clamp(3rem,10vw,4.2rem);line-height:1.15}
  .pic .word{font:700 1.3rem var(--letters)}
  .pic .badge{position:absolute;top:6px;right:8px;font-size:1.1rem}

  /* Plateau */
  .stage{margin-top:18px}
  #board{position:relative;--size:96px;background:rgba(255,255,255,.55);border-radius:28px;padding:18px 14px 24px;min-height:160px}
  #picto{text-align:center;font-size:clamp(4rem,calc(var(--size) * 1.25),8rem);line-height:1.15;margin-bottom:10px}
  #picto:empty{display:none}
  .slots,.tray{display:flex;flex-wrap:nowrap;justify-content:center;gap:var(--gap,10px)}
  .slot,.home{flex:0 0 auto}
  .tray{margin-top:30px;min-height:var(--size)}
  #board.edit .tray,#board.won .tray{display:none}
  .slot,.home{width:var(--size);height:var(--size);border-radius:calc(var(--size) * .22)}
  .slot{border:4px dashed var(--ink-soft);background:rgba(255,255,255,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink)}
  .home{background:rgba(35,50,92,.06)}
  .empty-msg{text-align:center;color:var(--ink-soft);font-size:1.3rem;margin:30px 0}

  .tile{position:absolute;left:0;top:0;width:var(--size);height:var(--size);z-index:2;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;
        transition:transform var(--dur,0ms) cubic-bezier(.34,1.35,.5,1)}
  .tile .face{width:100%;height:100%;border-radius:calc(var(--size) * .22);background:var(--c,var(--sun));box-shadow:0 5px 0 rgba(35,50,92,.25);
        display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);transition:transform .15s,background .2s}
  .tile.drag{z-index:10;cursor:grabbing}
  .tile.drag .face{transform:scale(1.08);box-shadow:0 14px 18px rgba(35,50,92,.3)}
  .tile.ok{cursor:default}
  .tile.ok .face{box-shadow:0 5px 0 #2f9a68,inset 0 0 0 4px var(--go)}
  .tile.shake .face{animation:shake .4s;background:var(--red)}
  .tile.dance .face{animation:dance .32s ease-in-out 2}
  .tile.pop .face{animation:pop .3s}

  /* Lettres : bâton (.p) et cursive (.c) */
  #board .p{font:700 calc(var(--size) * .62) var(--letters);line-height:1}
  #board .c{font:400 calc(var(--size) * .46) var(--cursive);line-height:1.25;display:none}
  #board[data-script="cursive"] .p{display:none}
  #board[data-script="cursive"] .c{display:block}
  #board[data-script="both"] .p{font-size:calc(var(--size) * .4)}
  #board[data-script="both"] .c{display:block;font-size:calc(var(--size) * .3)}

  @keyframes dance{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) translateY(-8px)}75%{transform:rotate(14deg) translateY(-8px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  @keyframes pop{50%{transform:scale(1.18)}}

  .bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .win{text-align:center;margin-top:12px}
  .bravo{font-size:clamp(2.4rem,8vw,4rem);font-weight:800;margin:0}
  .cursive-word{font-family:var(--cursive);font-size:clamp(2.2rem,8vw,4rem);margin:6px 0 4px;line-height:1.5}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:100}

  @media (max-width:480px){
    body{padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
    #board{padding:14px 6px 20px;border-radius:22px}
    .slot{border-width:3px}
    .tray{margin-top:22px}
  }
  @media (prefers-reduced-motion: reduce){
    .tile .face{animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Les lettres en vadrouille</h1>
    <div class="top-actions">
      <div class="stars" title="Mots réussis">⭐ <span id="stars">0</span></div>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="Couper le son">🔊</button>
    </div>
  </header>

  <section class="panel" id="panel">
    <label for="wordInput">Écris un mot, puis appuie sur Entrée</label>
    <div class="row">
      <input id="wordInput" type="text" maxlength="12" placeholder="ex : papa"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
      <button class="btn go big" id="goBtn" type="button">Mélanger !</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <div class="row tools">
      <div class="seg" role="group" aria-label="Type de lettres">
        <button type="button" data-case="upper">ABC</button>
        <button type="button" data-case="lower">abc</button>
      </div>
      <div class="seg" role="group" aria-label="Écriture">
        <button type="button" data-script="print">Bâton</button>
        <button type="button" data-script="cursive" class="cur">cursive</button>
        <button type="button" data-script="both">Les deux</button>
      </div>
    </div>
    <div class="history" id="history"></div>
  </section>

  <main class="stage" id="stage">
    <div id="board" class="edit" data-script="print">
      <div id="picto" aria-hidden="true"></div>
      <div class="slots" id="slots"></div>
      <div class="tray" id="tray"></div>
    </div>

    <div class="bar" id="playBar" hidden>
      <button class="btn hint big" id="hintBtn" type="button" aria-label="Indice : coûte une étoile">💡 Indice <span class="cost" aria-hidden="true">−1 ⭐</span></button>
      <button class="btn big" id="listenBtn" type="button">👂 Écouter le mot</button>
      <button class="btn big" id="newBtn" type="button">✏️ Nouveau mot</button>
    </div>

    <div class="win" id="winBar" hidden>
      <p class="bravo">Bravo !</p>
      <p class="cursive-word" id="cursiveWord" hidden></p>
      <div class="bar">
        <button class="btn big" id="againBtn" type="button">🔁 Rejouer</button>
        <button class="btn go big" id="nextBtn" type="button">➡️ Image suivante</button>
        <button class="btn big" id="newBtn2" type="button">✏️ Nouveau mot</button>
      </div>
    </div>
  </main>

  <section class="panel picker" id="picker">
    <div class="picker-head">
      <h2>Ou choisis une image</h2>
      <div class="seg" role="group" aria-label="Niveau">
        <button type="button" data-level="1">Niveau 1</button>
        <button type="button" data-level="2">Niveau 2</button>
      </div>
    </div>
    <div class="pics" id="pics"></div>
  </section>
</div>
<canvas id="confetti"></canvas>

<script>
(() => {
  // ---------- Listes de mots ----------
  const WORDS = {
    1: [['lama','🦙'],['moto','🏍️'],['vélo','🚲'],['canapé','🛋️'],['judo','🥋'],
        ['radio','📻'],['piano','🎹'],['koala','🐨'],['kimono','👘'],['kayak','🛶']],
    2: [['lune','🌙'],['robe','👗'],['pile','🔋'],['tomate','🍅'],['banane','🍌'],
        ['tulipe','🌷'],['salade','🥗'],['patate','🥔'],['malade','🤒'],['pirate','🏴‍☠️']]
  };
  const KNOWN = {};
  for (const lv of [1, 2]) WORDS[lv].forEach(([w, e], i) => { KNOWN[w] = { e, lv, i }; });

  // ---------- Sauvegarde (localStorage) ----------
  const KEY = 'lettres-vadrouille';
  const DEFAULTS = { upper: true, script: 'print', sound: true, stars: 0, history: [], level: 1, done: [] };
  const state = (() => {
    try { return Object.assign({}, DEFAULTS, JSON.parse(localStorage.getItem(KEY) || '{}')); }
    catch (e) { return Object.assign({}, DEFAULTS); }
  })();
  if (![1, 2].includes(state.level)) state.level = 1;
  if (!Array.isArray(state.done)) state.done = [];
  if (!Array.isArray(state.history)) state.history = [];
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  // ---------- Outils ----------
  const $ = s => document.querySelector(s);
  const board = $('#board'), slotsEl = $('#slots'), trayEl = $('#tray'), pictoEl = $('#picto'), input = $('#wordInput');
  const COLORS = ['var(--sun)', 'var(--coral)', 'var(--mint)', 'var(--blue)', 'var(--lilac)'];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T = ms => reduce ? Math.min(ms, 150) : ms;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const frame = () => new Promise(r => requestAnimationFrame(() => r()));
  const rand = (a, b) => a + Math.random() * (b - a);

  let word = '', emoji = '', mode = 'edit', busy = false, won = false;
  let tiles = [], slots = [], homes = [], filled = [];

  const clean = s => s.toLowerCase().normalize('NFC').replace(/[^a-zàâäçéèêëîïôöùûüÿœæ]/g, '').slice(0, 12);
  const disp = s => state.upper ? s.toUpperCase() : s;
  const faceHTML = ch => `<span class="p">${disp(ch)}</span><span class="c">${disp(ch)}</span>`;
  const sizeNow = () => parseFloat(getComputedStyle(board).getPropertyValue('--size')) || 96;

  function rectOf(el) {
    const b = board.getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - b.left, y: r.top - b.top };
  }
  function setPos(t, p, rot, dur) {
    t.x = p.x; t.y = p.y;
    t.el.style.setProperty('--dur', dur + 'ms');
    t.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${rot}deg)`;
  }
  function sizeFor(n) {
    const cs = getComputedStyle(board);
    const avail = board.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
    const gap = avail < 420 ? 6 : 10;
    const s = Math.max(24, Math.min(120, Math.floor((avail - gap * (n - 1)) / n)));
    board.style.setProperty('--size', s + 'px');
    board.style.setProperty('--gap', gap + 'px');
  }

  // ---------- Affichage du mot (mode écriture) ----------
  function buildSlots(n) {
    slotsEl.innerHTML = ''; trayEl.innerHTML = ''; slots = []; homes = [];
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div'); s.className = 'slot'; slotsEl.appendChild(s); slots.push(s);
      const h = document.createElement('div'); h.className = 'home'; trayEl.appendChild(h); homes.push(h);
    }
  }
  function clearTiles() { tiles.forEach(t => t.el.remove()); tiles = []; filled = []; }
  function preview() {
    clearTiles();
    $('#stage').hidden = mode === 'edit' && !word;
    sizeFor(Math.max(word.length, 1));
    buildSlots(word.length);
    [...word].forEach((ch, i) => { slots[i].innerHTML = faceHTML(ch); });
    pictoEl.textContent = emoji;
  }
  function setWord(w) {
    word = w;
    emoji = KNOWN[w] ? KNOWN[w].e : '';
  }

  // ---------- Mélange ----------
  function shuffledPerm() {
    const n = word.length, allSame = [...word].every(c => c === word[0]);
    let p;
    for (let tries = 0; tries < 60; tries++) {
      p = [...Array(n).keys()];
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
      if (allSame) break;
      const arr = []; p.forEach((h, i) => { arr[h] = word[i]; });
      if (arr.join('') !== word) break;
    }
    return p;
  }

  async function shuffle() {
    if (word.length < 2) { $('#msg').textContent = "Écris un mot d'au moins 2 lettres."; return; }
    busy = true; won = false; mode = 'play';
    $('#msg').textContent = '';
    $('#panel').hidden = true; $('#picker').hidden = true;
    $('#winBar').hidden = true; $('#playBar').hidden = false;
    board.classList.remove('edit', 'won');
    addHistory(word);
    preview();
    await frame();

    filled = new Array(word.length).fill(null);
    tiles = [...word].map((ch, i) => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.innerHTML = `<div class="face">${faceHTML(ch)}</div>`;
      el.firstChild.style.setProperty('--c', COLORS[i % COLORS.length]);
      board.appendChild(el);
      const t = { el, ch, home: i, slot: null, moving: false, drag: false, x: 0, y: 0 };
      setPos(t, rectOf(slots[i]), 0, 0);
      slots[i].innerHTML = '';
      bindTile(t);
      return t;
    });

    await sleep(T(450));
    tiles.forEach(t => t.el.classList.add('dance'));
    sound('shuffle');
    await sleep(T(680));
    tiles.forEach(t => t.el.classList.remove('dance'));

    const s = sizeNow();
    for (let k = 0; k < 2; k++) {
      const W = Math.max(0, board.clientWidth - s), H = Math.max(0, board.clientHeight - s);
      tiles.forEach(t => setPos(t, { x: rand(0, W), y: rand(0, H) }, rand(-45, 45), T(460)));
      sound('whoosh');
      await sleep(T(500));
    }

    const perm = shuffledPerm();
    tiles.forEach((t, i) => { t.home = perm[i]; setPos(t, rectOf(homes[t.home]), 0, T(650)); });
    await sleep(T(680));
    busy = false;
  }

  // ---------- Déplacer les lettres ----------
  function bindTile(t) {
    const el = t.el;
    el.addEventListener('pointerdown', e => {
      if (busy || t.slot !== null || t.moving) return;
      e.preventDefault();
      ensureAudio();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      const start = { px: e.clientX, py: e.clientY, x: t.x, y: t.y };
      let moved = false;
      t.drag = true;
      el.classList.add('drag');
      const onMove = ev => {
        const dx = ev.clientX - start.px, dy = ev.clientY - start.py;
        if (!moved && Math.hypot(dx, dy) > 8) moved = true;
        if (moved) setPos(t, { x: start.x + dx, y: start.y + dy }, 0, 0);
      };
      const onUp = () => {
        el.removeEventListener('pointermove', onMove);
        el.removeEventListener('pointerup', onUp);
        el.removeEventListener('pointercancel', onUp);
        el.classList.remove('drag');
        t.drag = false;
        if (!moved) {
          const i = filled.indexOf(null);
          if (i >= 0) tryPlace(t, i);
          return;
        }
        const i = slotAt(t);
        if (i >= 0 && !filled[i]) tryPlace(t, i); else goHome(t);
      };
      el.addEventListener('pointermove', onMove);
      el.addEventListener('pointerup', onUp);
      el.addEventListener('pointercancel', onUp);
    });
  }

  function slotAt(t) {
    const s = sizeNow(), cx = t.x + s / 2, cy = t.y + s / 2;
    let best = -1, bestD = Infinity;
    slots.forEach((el, i) => {
      const r = rectOf(el), d = Math.hypot(r.x + s / 2 - cx, r.y + s / 2 - cy);
      if (d < bestD) { bestD = d; best = i; }
    });
    return bestD < s * 0.8 ? best : -1;
  }

  function goHome(t) { setPos(t, rectOf(homes[t.home]), 0, T(450)); }

  async function tryPlace(t, i) {
    if (word[i] === t.ch) {
      filled[i] = t; t.slot = i; t.moving = true;
      setPos(t, rectOf(slots[i]), 0, T(350));
      await sleep(T(360));
      t.moving = false;
      t.el.classList.add('ok', 'pop');
      sound('good');
      setTimeout(() => t.el.classList.remove('pop'), 350);
      checkWin();
    } else {
      t.moving = true;
      setPos(t, rectOf(slots[i]), 0, T(300));
      await sleep(T(320));
      t.el.classList.add('shake');
      sound('bad');
      await sleep(T(430));
      t.el.classList.remove('shake');
      goHome(t);
      await sleep(T(460));
      t.moving = false;
    }
  }

  function hint() {
    if (busy || mode !== 'play' || won) return;
    ensureAudio();
    const empties = filled.map((f, i) => f ? -1 : i).filter(i => i >= 0).sort(() => Math.random() - .5);
    for (const i of empties) {
      const t = tiles.find(t => t.slot === null && !t.moving && !t.drag && t.ch === word[i]);
      if (t) { loseStar(); tryPlace(t, i); return; }
    }
  }

  // ---------- Un indice coûte une étoile ----------
  function loseStar() {
    if (state.stars <= 0) return;
    state.stars--; save(); renderStars();
    sound('lose');
    const box = $('.stars'), r = box.getBoundingClientRect();
    box.classList.remove('hit'); void box.offsetWidth; box.classList.add('hit');
    const f = document.createElement('div');
    f.className = 'lost';
    f.textContent = '−1 ⭐';
    f.style.left = Math.max(8, r.left + r.width / 2 - 40) + 'px';
    f.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1400);
  }

  // ---------- Victoire ----------
  function checkWin() {
    if (!won && filled.length && filled.every(Boolean)) { won = true; win(); }
  }
  async function win() {
    state.stars++;
    if (!state.done.includes(word)) state.done.push(word);
    save(); renderStars(); renderPicker();
    $('#playBar').hidden = true;
    await sleep(250);
    board.classList.add('won');
    confetti();
    sound('win');
    setTimeout(() => speak('Bravo ! ' + word), 700);
    $('#cursiveWord').textContent = disp(word);
    $('#cursiveWord').hidden = state.script === 'print';
    $('#nextBtn').hidden = !KNOWN[word];
    $('#winBar').hidden = false;
  }

  // ---------- Navigation ----------
  function goEdit() {
    mode = 'edit'; busy = false; won = false;
    board.classList.remove('won');
    board.classList.add('edit');
    $('#playBar').hidden = true; $('#winBar').hidden = true;
    $('#panel').hidden = false; $('#picker').hidden = false;
    input.value = ''; setWord('');
    preview();
    renderHistory();
    if (matchMedia('(pointer: fine)').matches) input.focus();
  }

  async function pickWord(w) {
    if (busy) return;
    ensureAudio();
    busy = true;
    mode = 'show';
    input.value = w; setWord(w);
    $('#panel').hidden = true; $('#picker').hidden = true;
    $('#playBar').hidden = true; $('#winBar').hidden = true;
    board.classList.remove('won');
    board.classList.add('edit');
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
    preview();
    $('#stage').hidden = false;
    speak(w);
    await sleep(T(1400));
    busy = false;
    shuffle();
  }

  function startTyped() {
    ensureAudio();
    setWord(clean(input.value));
    if (KNOWN[word]) { pickWord(word); return; }
    shuffle();
  }

  // ---------- Réglages ----------
  function renderStars() { $('#stars').textContent = state.stars; }

  function setCase(upper) {
    state.upper = upper; save();
    document.querySelectorAll('[data-case]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.case === 'upper') === upper)));
    if (mode === 'play') {
      tiles.forEach(t => { t.el.firstChild.innerHTML = faceHTML(t.ch); });
      $('#cursiveWord').textContent = disp(word);
    } else {
      [...word].forEach((ch, i) => { if (slots[i]) slots[i].innerHTML = faceHTML(ch); });
    }
    renderPicker(); renderHistory();
  }

  function setScript(m) {
    state.script = m; save();
    board.dataset.script = m;
    document.querySelectorAll('[data-script]').forEach(b => {
      if (b !== board) b.setAttribute('aria-pressed', String(b.dataset.script === m));
    });
    if (won) $('#cursiveWord').hidden = m === 'print';
  }

  function setSound(on) {
    state.sound = on; save();
    const b = $('#soundBtn');
    b.textContent = on ? '🔊' : '🔇';
    b.setAttribute('aria-label', on ? 'Couper le son' : 'Remettre le son');
    if (!on && 'speechSynthesis' in window) speechSynthesis.cancel();
  }

  function setLevel(lv) {
    state.level = lv; save();
    renderPicker();
  }

  function renderPicker() {
    document.querySelectorAll('[data-level]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.level === state.level)));
    const g = $('#pics');
    g.innerHTML = '';
    WORDS[state.level].forEach(([w, e]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'pic';
      b.setAttribute('aria-label', w);
      b.innerHTML = `<span class="emo" aria-hidden="true">${e}</span><span class="word">${disp(w)}</span>` +
        (state.done.includes(w) ? '<span class="badge" aria-hidden="true">⭐</span>' : '');
      b.addEventListener('click', () => pickWord(w));
      g.appendChild(b);
    });
  }

  function addHistory(w) {
    state.history = [w, ...state.history.filter(x => x !== w)].slice(0, 8);
    save();
  }
  function renderHistory() {
    const h = $('#history');
    h.innerHTML = '';
    state.history.forEach(w => {
      const c = document.createElement('button');
      c.type = 'button'; c.className = 'chip';
      c.textContent = (KNOWN[w] ? KNOWN[w].e + ' ' : '') + disp(w);
      c.addEventListener('click', () => { input.value = w; startTyped(); });
      h.appendChild(c);
    });
  }

  // ---------- Sons et voix ----------
  let ac = null;
  function ensureAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function tone(f, start, dur, type = 'triangle', vol = .16) {
    const t0 = ac.currentTime + start, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + .02);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  }
  function sound(kind) {
    if (!state.sound) return;
    ensureAudio();
    if (!ac) return;
    if (kind === 'good') { tone(660, 0, .12); tone(990, .08, .2); }
    else if (kind === 'bad') { tone(240, 0, .16, 'square', .06); tone(180, .12, .22, 'square', .06); }
    else if (kind === 'shuffle') { [523, 659, 784, 659].forEach((f, i) => tone(f, i * .08, .12, 'triangle', .1)); }
    else if (kind === 'whoosh') {
      const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(300, t0);
      o.frequency.exponentialRampToValueAtTime(900, t0 + .3);
      g.gain.setValueAtTime(.08, t0);
      g.gain.exponentialRampToValueAtTime(.001, t0 + .35);
      o.connect(g); g.connect(ac.destination);
      o.start(t0); o.stop(t0 + .4);
    }
    else if (kind === 'lose') { tone(520, 0, .14, 'triangle', .12); tone(390, .12, .2, 'triangle', .12); }
    else if (kind === 'win') { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .13, .25, 'triangle', .14)); }
  }
  function speak(text, force) {
    if ((!state.sound && !force) || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'fr-FR'; u.rate = .85;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) speechSynthesis.getVoices();

  // ---------- Confettis ----------
  function confetti() {
    if (reduce) return;
    const c = $('#confetti'), x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
    const cols = ['#ffc93c', '#ff6b6b', '#4cc38a', '#9fd2ff', '#cfbfff', '#ffab8f'];
    const ps = Array.from({ length: 160 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5,
      vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4,
      s: 7 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .3,
      col: cols[Math.floor(Math.random() * cols.length)]
    }));
    const t0 = performance.now();
    (function step(now) {
      x.clearRect(0, 0, c.width, c.height);
      ps.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r);
        x.fillStyle = p.col; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        x.restore();
      });
      if (now - t0 < 3500) requestAnimationFrame(step);
      else { x.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
    })(t0);
  }

  // ---------- Événements ----------
  input.addEventListener('input', () => {
    if (mode !== 'edit') return;
    $('#msg').textContent = '';
    setWord(clean(input.value));
    preview();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); startTyped(); } });
  $('#goBtn').addEventListener('click', startTyped);
  $('#hintBtn').addEventListener('click', hint);
  $('#listenBtn').addEventListener('click', () => speak(word, true));
  $('#newBtn').addEventListener('click', goEdit);
  $('#newBtn2').addEventListener('click', goEdit);
  $('#againBtn').addEventListener('click', () => shuffle());
  $('#nextBtn').addEventListener('click', () => {
    const k = KNOWN[word];
    if (!k) return;
    const list = WORDS[k.lv];
    pickWord(list[(k.i + 1) % list.length][0]);
  });
  $('#soundBtn').addEventListener('click', () => { ensureAudio(); setSound(!state.sound); });
  document.querySelectorAll('button[data-case]').forEach(b => b.addEventListener('click', () => setCase(b.dataset.case === 'upper')));
  document.querySelectorAll('button[data-script]').forEach(b => b.addEventListener('click', () => setScript(b.dataset.script)));
  document.querySelectorAll('button[data-level]').forEach(b => b.addEventListener('click', () => setLevel(+b.dataset.level)));

  let resizeTimer;
  addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (mode === 'play') {
        sizeFor(word.length);
        requestAnimationFrame(() => tiles.forEach(t => {
          if (!t.drag) setPos(t, rectOf(t.slot !== null ? slots[t.slot] : homes[t.home]), 0, 0);
        }));
      } else {
        sizeFor(Math.max(word.length, 1));
      }
    }, 120);
  });

  // ---------- Démarrage ----------
  renderStars();
  setSound(state.sound);
  setScript(state.script);
  setCase(state.upper);
  renderPicker();
  renderHistory();
  preview();
})();
</script>
</body>
</html>
