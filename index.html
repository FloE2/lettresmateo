<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les lettres en vadrouille</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Playwrite+FR+Moderne&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#dcefff; --sky-deep:#b9dcfb;
    --ink:#23325c; --ink-soft:#5a6a92;
    --white:#ffffff; --sun:#ffc93c; --go:#4cc38a; --red:#ff6b6b;
    --ui:'Baloo 2','Trebuchet MS','Segoe UI',system-ui,sans-serif;
    --letters:'Andika','Comic Sans MS','Segoe UI',system-ui,sans-serif;
    --cursive:'Playwrite FR Moderne','Segoe Script','Comic Sans MS',cursive;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{margin:0;min-height:100%}
  body{
    font-family:var(--ui); color:var(--ink);
    background:
      radial-gradient(circle at 12% 14%, #fff 0 54px, transparent 55px),
      radial-gradient(circle at 18% 12%, #fff 0 40px, transparent 41px),
      radial-gradient(circle at 88% 8%, #fff 0 46px, transparent 47px),
      radial-gradient(circle at 93% 10%, #fff 0 32px, transparent 33px),
      linear-gradient(180deg, var(--sky-deep), var(--sky) 45%);
    background-attachment:fixed;
  }
  button,input{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:4px solid var(--sun);outline-offset:3px}
  [hidden]{display:none !important}

  .wrap{max-width:980px;margin:0 auto;padding:14px clamp(10px,3vw,24px) 40px}
  h1{font-weight:800;font-size:clamp(1.8rem,6vw,3rem);margin:6px 0 14px;text-align:center;line-height:1.1}

  .panel{background:var(--white);border-radius:26px;padding:clamp(14px,3vw,24px);box-shadow:0 6px 0 rgba(35,50,92,.12);margin-bottom:16px}
  .panel h2{margin:0 0 10px;font-size:1.4rem}
  label{font-size:1.15rem;font-weight:600;display:block;margin-bottom:6px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text]{
    flex:1 1 200px;min-width:0;font-family:var(--letters);font-size:1.6rem;padding:10px 16px;
    border:3px solid var(--sky-deep);border-radius:18px;background:#f7fbff;outline:none
  }
  input[type=text]:focus{border-color:var(--ink-soft)}
  .msg{min-height:1.4em;margin:6px 0 0;color:#c0392b;font-weight:600}

  .btn{border:0;border-radius:18px;padding:10px 18px;background:var(--sky);font-weight:800;font-size:1.15rem;
       box-shadow:0 4px 0 rgba(35,50,92,.2);transition:transform .1s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(35,50,92,.2)}
  .btn.big{font-size:1.4rem;padding:12px 26px}
  .btn.go{background:var(--go);color:#fff}
  .btn.hint{background:var(--sun)}
  .btn .cost{display:inline-block;background:#fff;border-radius:999px;padding:0 9px;margin-left:6px;font-size:.95rem}
  .icon-btn{border:0;background:var(--white);border-radius:50%;width:48px;height:48px;font-size:1.4rem;box-shadow:0 3px 0 rgba(35,50,92,.15)}

  .seg{display:inline-flex;background:var(--sky);border-radius:16px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;border-radius:12px;padding:6px 14px;font-weight:800;font-size:1.05rem}
  .seg button[aria-pressed=true]{background:var(--white);box-shadow:0 2px 0 rgba(35,50,92,.15)}
  .seg .cur{font-family:var(--cursive);font-weight:400;font-size:.95rem}
  .settings{margin-top:14px}

  /* Meilleurs scores */
  .scores{list-style:none;margin:0;padding:0}
  .scores li{display:grid;grid-template-columns:2.4em 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;font-size:1.2rem}
  .scores li:nth-child(odd){background:#f3f8ff}
  .scores li.me{background:#fff3c4;animation:glow 1.2s ease 2}
  .scores .rk{font-weight:800;text-align:center}
  .scores .nm{font-family:var(--letters);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .scores .lv{color:var(--ink-soft);font-size:1rem}
  .scores .pt{font-weight:800}
  .scores li.empty{display:block;color:var(--ink-soft);background:none;font-size:1.1rem}
  @keyframes glow{50%{background:#ffe27a}}

  details.free summary{font-weight:800;font-size:1.2rem;cursor:pointer}
  details.free[open] summary{margin-bottom:10px}

  /* Écran de jeu */
  .gamebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .gamebar .lvl{font-weight:800;font-size:clamp(1.3rem,4.5vw,1.8rem);flex:1 1 auto}
  .dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  .dots i{width:11px;height:11px;border-radius:50%;background:rgba(35,50,92,.18);display:inline-block}
  .dots i.done{background:var(--go)}
  .dots i.now{background:var(--sun)}
  .stars{background:var(--white);border-radius:999px;padding:4px 16px;font-weight:800;font-size:1.4rem;box-shadow:0 3px 0 rgba(35,50,92,.15)}
  .stars.hit{animation:hit .5s}
  @keyframes hit{25%{transform:translateX(-6px);color:var(--red)}75%{transform:translateX(6px);color:var(--red)}}

  .lives{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;background:var(--white);border-radius:20px;padding:8px 14px;margin-bottom:10px;box-shadow:0 4px 0 rgba(35,50,92,.1)}
  .hearts{display:flex;gap:2px;flex-wrap:wrap;justify-content:center}
  .heart{font-size:clamp(1.15rem,4.6vw,1.7rem);line-height:1;transition:filter .4s,opacity .4s,transform .4s}
  .heart.lost{filter:grayscale(1);opacity:.28;transform:scale(.8)}
  .heart.breaking{animation:breakHeart .8s}
  @keyframes breakHeart{0%{transform:scale(1)}30%{transform:scale(1.6) rotate(-12deg)}60%{transform:scale(1.2) rotate(10deg)}100%{transform:scale(.8)}}
  .chances{font-weight:800;font-size:clamp(1.15rem,4vw,1.5rem);white-space:nowrap}
  .chances b{font-size:1.3em}
  .chances.low{color:#d63031}

  .stage{background:rgba(255,255,255,.55);border-radius:28px;padding:clamp(10px,2.5vw,20px)}
  #picto{font-size:clamp(4rem,16vw,7rem);text-align:center;line-height:1.1;height:1.15em}
  #picto.bounce{animation:pop .6s}
  #board{position:relative;width:100%;margin:6px auto 0;touch-action:manipulation}
  .tray{position:absolute;left:0;right:0;border-radius:22px;background:rgba(35,50,92,.07);border:3px dashed rgba(35,50,92,.12)}
  .slot{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.22);
        border:3px dashed rgba(35,50,92,.35);background:rgba(255,255,255,.7);transition:background .2s,border-color .2s}
  .slot.hot{border-color:var(--go);background:#e6fff2}
  .tile{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.22);
        background:var(--c);box-shadow:0 5px 0 rgba(35,50,92,.25);display:grid;place-items:center;
        transition:transform var(--dur,.45s) cubic-bezier(.3,1.25,.5,1);touch-action:none;cursor:grab;
        user-select:none;-webkit-user-select:none;z-index:2}
  .tile.dragging{transition:none;z-index:20;cursor:grabbing;box-shadow:0 12px 18px rgba(35,50,92,.3)}
  .tile.placed{cursor:default;z-index:1}
  .tile.fly{--dur:.6s;z-index:5}
  .tile.wrong{z-index:15}
  .no-anim .tile,.no-anim .slot{transition:none !important}
  .face{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;pointer-events:none}
  .face .p{font-family:var(--letters);font-weight:700;font-size:calc(var(--s)*.64)}
  .face .c{font-family:var(--cursive);font-size:calc(var(--s)*.42);line-height:1.5}
  #board[data-script=print] .face .c{display:none}
  #board[data-script=cursive] .face .p{display:none}
  #board[data-script=both] .face .p{font-size:calc(var(--s)*.4)}
  #board[data-script=both] .face .c{font-size:calc(var(--s)*.28)}
  .tile.shake .face{animation:shake .45s}
  .tile.pop .face{animation:pop .5s}
  .tile.dance .face{animation:dance .5s ease-in-out infinite alternate}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
  @keyframes pop{50%{transform:scale(1.2)}}
  @keyframes dance{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-6px)}}

  .bar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .say{text-align:center;font-weight:800;font-size:clamp(1.2rem,4.5vw,1.7rem);min-height:1.5em;margin:10px 0 0}
  .say.bad{color:#d63031}
  .say.good{color:#1f9d63}
  .cursive-word{font-family:var(--cursive);font-size:clamp(2rem,8vw,3.6rem);text-align:center;margin:4px 0 0;line-height:1.5}

  .float{position:fixed;font-weight:800;font-size:2rem;pointer-events:none;z-index:120;animation:floatUp 1.2s ease-out forwards}
  .float.minus{color:var(--red)}
  .float.plus{color:#e0a800}
  @keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-70px)}}

  /* Annonce de niveau */
  #banner{position:fixed;inset:0;display:grid;place-items:center;background:rgba(220,239,255,.85);z-index:90}
  #banner div{background:var(--white);border-radius:32px;padding:26px 44px;text-align:center;box-shadow:0 8px 0 rgba(35,50,92,.15);animation:zoom .5s cubic-bezier(.3,1.5,.5,1)}
  #banner .big{font-size:clamp(2.6rem,11vw,5rem);font-weight:800;line-height:1}
  #banner .small{font-size:1.3rem;color:var(--ink-soft);margin-top:6px}
  @keyframes zoom{from{transform:scale(.3);opacity:0}}

  /* Fin de partie */
  .end{text-align:center}
  .end .emoji{font-size:5rem;line-height:1}
  .end h2{font-size:clamp(1.8rem,6vw,2.6rem);margin:6px 0}
  .end .score{font-size:clamp(2rem,8vw,3rem);font-weight:800;margin:4px 0 12px}
  .end p{font-size:1.2rem;margin:4px 0}

  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none;z-index:100}

  @media (prefers-reduced-motion: reduce){
    .tile{--dur:.2s !important}
    .tile .face,.heart,#banner div{animation:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Les lettres en vadrouille</h1>

  <!-- ===== ACCUEIL ===== -->
  <section id="home">
    <div class="panel">
      <label for="nameInput">Ton prénom</label>
      <div class="row">
        <input id="nameInput" type="text" maxlength="14" placeholder="ex : Léo" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button class="btn go big" id="playBtn" type="button">▶ Jouer</button>
      </div>
      <p class="msg" id="nameMsg" role="status"></p>
      <p style="margin:2px 0 0;color:var(--ink-soft)">10 niveaux, du plus facile au plus dur. Tu as 10 chances pour toute la partie.</p>
      <div class="row settings">
        <div class="seg" role="group" aria-label="Type de lettres">
          <button type="button" data-case="upper">ABC</button>
          <button type="button" data-case="lower">abc</button>
        </div>
        <div class="seg" role="group" aria-label="Écriture">
          <button type="button" data-script="print">Bâton</button>
          <button type="button" data-script="cursive" class="cur">cursive</button>
          <button type="button" data-script="both">Les deux</button>
        </div>
        <button class="icon-btn soundBtn" type="button" aria-label="Couper le son">🔊</button>
      </div>
    </div>

    <div class="panel">
      <h2>🏆 Meilleurs scores</h2>
      <ol class="scores" id="homeScores"></ol>
    </div>

    <div class="panel">
      <details class="free">
        <summary>✏️ Mot libre (pour les parents)</summary>
        <label for="freeInput">Écris un mot, il sera mélangé (sans chances ni score)</label>
        <div class="row">
          <input id="freeInput" type="text" maxlength="12" placeholder="ex : papa" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
          <button class="btn big" id="freeBtn" type="button">Mélanger !</button>
        </div>
        <p class="msg" id="freeMsg" role="status"></p>
      </details>
    </div>
  </section>

  <!-- ===== JEU ===== -->
  <section id="game" hidden>
    <div class="gamebar">
      <button class="icon-btn" id="homeBtn" type="button" aria-label="Retour à l'accueil">🏠</button>
      <div class="lvl" id="lvlLabel"></div>
      <div class="stars" id="starsBox" title="Score">⭐ <span id="stars">0</span></div>
      <button class="icon-btn soundBtn" type="button" aria-label="Couper le son">🔊</button>
    </div>

    <div class="lives" id="lives">
      <div class="hearts" id="hearts" aria-hidden="true"></div>
      <div class="chances" id="chances" role="status"></div>
    </div>

    <main class="stage">
      <div id="picto" aria-hidden="true"></div>
      <div id="board" data-script="print">
        <div class="tray" id="tray"></div>
      </div>
      <p class="say" id="say" role="status"></p>
      <p class="cursive-word" id="cursiveWord" hidden></p>
      <div class="bar" id="playBar">
        <button class="btn hint big" id="hintBtn" type="button">💡 Indice<span class="cost" id="hintCost">−1 ⭐</span></button>
        <button class="btn big" id="listenBtn" type="button">👂 Écouter</button>
      </div>
      <div class="bar" id="freeBar" hidden>
        <button class="btn go big" id="freeNewBtn" type="button">✏️ Nouveau mot</button>
      </div>
    </main>
  </section>

  <!-- ===== FIN ===== -->
  <section id="end" hidden>
    <div class="panel end">
      <div class="emoji" id="endEmoji"></div>
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="score">⭐ <span id="endScore">0</span></div>
      <p id="endRank"></p>
      <div class="bar">
        <button class="btn go big" id="againBtn" type="button">▶ Rejouer</button>
        <button class="btn big" id="toHomeBtn" type="button">🏠 Accueil</button>
      </div>
    </div>
    <div class="panel">
      <h2>🏆 Meilleurs scores</h2>
      <ol class="scores" id="endScores"></ol>
    </div>
  </section>
</div>

<div id="banner" hidden><div><div class="big" id="bannerBig"></div><div class="small" id="bannerSmall"></div></div></div>
<canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';

  /* ================= RÉGLAGES DU JEU ================= */
  const MAX_LIVES = 10;        // erreurs autorisées sur toute la partie
  const ERRORS_BEFORE_MIX = 2; // erreurs sur un même mot avant de le remélanger
  const SPEECH_RATE = 0.6;     // vitesse de la voix (1 = normal, plus petit = plus lent)

  /* 10 niveaux, du plus simple au plus dur (programme de CP) */
  const LEVELS = [
    { title: 'Syllabes simples',       words: [['lama','🦙'],['moto','🏍️'],['vélo','🚲'],['judo','🥋'],['kiwi','🥝'],['zéro','0️⃣'],
                                                ['papa','👨'],['papi','👴'],['mamie','👵'],['ami','🤝'],['mini','🐜'],['vis','🔩'],['Mars','🔴']] },
    { title: 'Mots de 3 syllabes',     words: [['radio','📻'],['piano','🎹'],['koala','🐨'],['kayak','🛶'],['canapé','🛋️'],['kimono','👘'],
                                                ['caméra','📷'],['numéro','🔢']] },
    { title: 'Le e muet et les lettres muettes', words: [['lune','🌙'],['robe','👗'],['olive','🫒'],['tomate','🍅'],['salade','🥗'],['pirate','🏴‍☠️'],
                                                ['image','🖼️'],['orage','⛈️'],['plume','🪶'],['tenue','🧑‍🚀'],['robot','🤖'],['petit','🤏'],['bras','💪']] },
    { title: 'Plus longs avec e muet', words: [['banane','🍌'],['tulipe','🌷'],['cabane','🛖'],['otarie','🦭'],['ananas','🍍'],['pomme','🍎'],
                                                ['table','🍽️'],['câble','🔌'],['licorne','🦄'],['poterie','🏺'],['planète','🪐'],['cratère','🌑'],['kilomètre','🛣️']] },
    { title: 'Les sons ou et on',      words: [['loup','🐺'],['poule','🐔'],['mouton','🐑'],['bonbon','🍬'],['souris','🐭'],['nounours','🧸']] },
    { title: 'Les sons ch et oi',      words: [['chat','🐱'],['vache','🐄'],['cheval','🐴'],['roi','🤴'],['poire','🍐'],['étoile','⭐'],
                                                ['roche','🪨'],['peluche','🐻'],['machine','⚙️']] },
    { title: 'Les sons an, in, eau',   words: [['lapin','🐰'],['sapin','🎄'],['orange','🍊'],['gant','🧤'],['bateau','⛵'],['cadeau','🎁']] },
    { title: 'Les sons ai, ei, gn, ill',words: [['maison','🏠'],['fraise','🍓'],['baleine','🐋'],['montagne','⛰️'],['abeille','🐝'],['soleil','☀️']] },
    { title: 'Les sons ien, oin, ph, gu',words: [['chien','🐶'],['pingouin','🐧'],['éléphant','🐘'],['guitare','🎸'],['girafe','🦒'],['nuage','☁️']] },
    { title: 'Les grands mots',        words: [['crocodile','🐊'],['papillon','🦋'],['escargot','🐌'],['dinosaure','🦕'],['champignon','🍄'],['parapluie','☂️']] },
  ];

  const COLORS = ['#ff8a80','#ffd166','#7bdcb5','#8ecbff','#c3a6ff','#ffab8f','#97e6c4','#ffb3d9','#a0e7e5','#ffe08a','#b5c7ff','#f7a8c4'];
  const MAX_LETTERS = 12;
  const KEY = 'lettres-vadrouille';

  /* ================= ÉTAT SAUVEGARDÉ ================= */
  const state = Object.assign({ upper: true, script: 'print', sound: true, name: '', scores: [], seen: {} }, load());
  if (!Array.isArray(state.scores)) state.scores = [];
  if (!state.seen || typeof state.seen !== 'object') state.seen = {};
  if (!['print','cursive','both'].includes(state.script)) state.script = 'print';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const board = $('#board'), tray = $('#tray');

  /* ================= SONS ================= */
  let AC = null;
  function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
  function tone(freq, start, dur, type = 'sine', vol = .18) {
    if (!state.sound) return; const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    const t = a.currentTime + start;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + .05);
  }
  const sfx = {
    good: () => { tone(660, 0, .15); tone(880, .08, .2); },
    bad:  () => { tone(220, 0, .25, 'square', .08); tone(180, .12, .3, 'square', .08); },
    win:  () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .12, .3, 'triangle')),
    level:() => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * .1, .25, 'triangle')),
    mix:  () => [400, 520, 350, 600, 450].forEach((f, i) => tone(f, i * .07, .1, 'triangle', .1)),
    lose: () => [392, 349, 311, 262].forEach((f, i) => tone(f, i * .22, .35, 'triangle')),
    hint: () => { tone(700, 0, .12); tone(500, .1, .2); },
  };

  /* Voix lente */
  function speak(text) {
    if (!state.sound || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).toLocaleLowerCase('fr-FR'));
    u.lang = 'fr-FR'; u.rate = SPEECH_RATE; u.pitch = 1.1;
    const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

  /* ================= PLATEAU ================= */
  let word = [], tiles = [], slots = [], phase = 'idle', M = null, drag = null, gen = 0;

  function cleanWord(raw) {
    let w = raw.normalize('NFC').replace(/[^\p{L}]/gu, '');
    w = state.upper ? w.toLocaleUpperCase('fr-FR') : w.toLocaleLowerCase('fr-FR');
    return Array.from(w).slice(0, MAX_LETTERS);
  }
  function cursiveText(chars) { return chars.join('').toLocaleLowerCase('fr-FR'); }

  function metrics(n) {
    const W = board.clientWidth || 300;
    const gap = Math.round(Math.max(4, Math.min(16, W * .018)));
    const s = Math.floor(Math.max(24, Math.min(120, (W - gap * (n - 1)) / n)));
    const rowW = n * s + (n - 1) * gap;
    const x0 = Math.max(0, (W - rowW) / 2);
    const slotY = 10;
    const poolY = slotY + s + Math.max(40, s * .55);
    return { W, s, gap, x0, slotY, poolY, H: poolY + s + 22 };
  }
  const slotXY = i => ({ x: M.x0 + i * (M.s + M.gap), y: M.slotY });
  const poolXY = p => ({ x: M.x0 + p * (M.s + M.gap), y: M.poolY });

  function setPos(t, x, y, rot = 0) { t.x = x; t.y = y; t.el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`; }

  function layout(instant) {
    M = metrics(word.length || 1);
    board.style.setProperty('--s', M.s + 'px');
    board.style.height = M.H + 'px';
    tray.style.top = (M.poolY - 11) + 'px';
    tray.style.height = (M.s + 22) + 'px';
    if (instant) board.classList.add('no-anim');
    slots.forEach((sl, i) => { const p = slotXY(i); sl.el.style.transform = `translate(${p.x}px, ${p.y}px)`; });
    tiles.forEach(t => {
      if (t.slot !== null) { const p = slotXY(t.slot); setPos(t, p.x, p.y); }
      else if (t.poolPos !== null) { t.home = poolXY(t.poolPos); setPos(t, t.home.x, t.home.y); }
    });
    if (instant) { void board.offsetWidth; requestAnimationFrame(() => board.classList.remove('no-anim')); }
  }

  function faceHTML(ch) {
    const low = ch.toLocaleLowerCase('fr-FR');
    return `<span class="face"><span class="p">${esc(ch)}</span><span class="c">${esc(low)}</span></span>`;
  }

  /* Construit le mot, lettres déjà à leur place (avant le mélange) */
  function build(chars) {
    board.querySelectorAll('.tile, .slot').forEach(n => n.remove());
    word = chars; tiles = []; slots = [];
    chars.forEach((ch, i) => {
      const s = document.createElement('div'); s.className = 'slot'; board.appendChild(s);
      slots.push({ el: s, ch, filled: true });
      const el = document.createElement('div');
      el.className = 'tile placed';
      el.style.setProperty('--c', COLORS[i % COLORS.length]);
      el.innerHTML = faceHTML(ch);
      board.appendChild(el);
      const t = { el, ch, i, slot: i, poolPos: null, home: null, x: 0, y: 0, busy: false };
      tiles.push(t); bindTile(t);
    });
    layout(true);
  }

  function shuffledOrder(n) {
    const idx = [...Array(n).keys()];
    const same = o => o.every((v, k) => word[v] === word[k]);
    for (let tries = 0; tries < 30; tries++) {
      for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      if (n < 2 || !same(idx)) break;
    }
    return idx;
  }

  /* Montre le mot, puis le mélange avec une animation */
  function showThenMix(delay = 1600) {
    const my = gen;
    phase = 'show';
    tiles.forEach(t => {
      t.slot = t.i; t.poolPos = null; t.busy = false;
      t.el.classList.add('placed'); t.el.classList.remove('shake', 'pop', 'wrong', 'dragging');
      const p = slotXY(t.i); setPos(t, p.x, p.y);
    });
    slots.forEach(s => { s.filled = true; s.el.classList.remove('hot'); });
    later(() => {
      if (my !== gen) return;
      phase = 'mix';
      sfx.mix();
      const order = shuffledOrder(tiles.length);
      tiles.forEach(t => { t.el.classList.add('dance', 'fly'); t.el.classList.remove('placed'); t.slot = null; });
      slots.forEach(s => s.filled = false);
      // 1) les lettres s'envolent dans tous les sens
      tiles.forEach(t => {
        const x = Math.random() * Math.max(0, M.W - M.s);
        const y = Math.random() * Math.max(0, M.H - M.s);
        setPos(t, x, y, (Math.random() - .5) * 120);
      });
      // 2) puis atterrissent mélangées dans le bac
      later(() => {
        if (my !== gen) return;
        order.forEach((ti, p) => { const t = tiles[ti]; t.poolPos = p; t.home = poolXY(p); setPos(t, t.home.x, t.home.y); });
      }, 650);
      later(() => {
        if (my !== gen) return;
        tiles.forEach(t => t.el.classList.remove('dance', 'fly'));
        phase = 'play';
      }, 1350);
    }, delay);
  }

  /* ----- Glisser / toucher ----- */
  function bindTile(t) {
    t.el.addEventListener('pointerdown', e => {
      if (phase !== 'play' || t.slot !== null || t.busy) return;
      e.preventDefault();
      ac();
      const r = board.getBoundingClientRect();
      drag = { t, id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left - t.x, oy: e.clientY - r.top - t.y, moved: false };
      try { t.el.setPointerCapture(e.pointerId); } catch (_) {}
    });
    t.el.addEventListener('pointermove', e => {
      if (!drag || drag.t !== t || drag.id !== e.pointerId) return;
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
      drag.moved = true; t.el.classList.add('dragging');
      const r = board.getBoundingClientRect();
      setPos(t, e.clientX - r.left - drag.ox, e.clientY - r.top - drag.oy, 6);
      const near = nearestSlot(t);
      slots.forEach((s, i) => s.el.classList.toggle('hot', i === near));
    });
    const end = e => {
      if (!drag || drag.t !== t || drag.id !== e.pointerId) return;
      const moved = drag.moved; drag = null;
      t.el.classList.remove('dragging');
      slots.forEach(s => s.el.classList.remove('hot'));
      if (phase !== 'play') { backHome(t); return; }
      if (!moved) { const i = slots.findIndex(s => !s.filled); if (i >= 0) tryPlace(t, i); return; }
      const i = nearestSlot(t);
      if (i >= 0) tryPlace(t, i); else backHome(t);
    };
    t.el.addEventListener('pointerup', end);
    t.el.addEventListener('pointercancel', e => { if (drag && drag.t === t) { drag = null; t.el.classList.remove('dragging'); backHome(t); } });
  }

  function nearestSlot(t) {
    let best = -1, bd = Infinity;
    slots.forEach((s, i) => {
      if (s.filled) return;
      const p = slotXY(i); const d = Math.hypot(p.x - t.x, p.y - t.y);
      if (d < bd) { bd = d; best = i; }
    });
    return bd < M.s * .8 ? best : -1;
  }
  function backHome(t) { if (t.home) setPos(t, t.home.x, t.home.y); }

  function tryPlace(t, i) {
    if (slots[i].filled) { backHome(t); return; }
    const p = slotXY(i);
    if (slots[i].ch === t.ch) {
      lockIn(t, i); sfx.good();
      checkWin();
    } else {
      // mauvaise lettre : elle va à la case, secoue la tête et revient
      const my = gen;
      t.busy = true; t.el.classList.add('wrong');
      setPos(t, p.x, p.y);
      later(() => { if (my !== gen) return; t.el.classList.add('shake'); sfx.bad(); }, 300);
      later(() => { if (my !== gen) return; t.el.classList.remove('shake', 'wrong'); backHome(t); t.busy = false; }, 800);
      later(() => { if (my === gen) onError(); }, 320);
    }
  }
  function lockIn(t, i) {
    slots[i].filled = true; t.slot = i; t.poolPos = null;
    t.el.classList.add('placed', 'pop');
    const p = slotXY(i); setPos(t, p.x, p.y);
    setTimeout(() => t.el.classList.remove('pop'), 550);
  }

  /* ================= PARTIE ================= */
  let mode = 'game';            // 'game' ou 'free'
  let level = 0, queue = [], wordIdx = 0, score = 0, lives = MAX_LIVES, wordErrors = 0, current = null;
  const timers = new Set();
  function later(fn, ms) { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; }
  function clearTimers() { timers.forEach(clearTimeout); timers.clear(); }

  function show(id) {
    ['home', 'game', 'end'].forEach(s => $('#' + s).hidden = s !== id);
    window.scrollTo(0, 0);
  }

  function pickWords(l) {
    // tous les mots du niveau doivent être réussis, dans un ordre mélangé
    const all = LEVELS[l].words.slice();
    for (let i = all.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [all[i], all[j]] = [all[j], all[i]]; }
    return all;
  }

  function startGame() {
    const name = $('#nameInput').value.trim();
    if (!name) { $('#nameMsg').textContent = 'Écris ton prénom pour jouer.'; $('#nameInput').focus(); return; }
    $('#nameMsg').textContent = '';
    state.name = name; save();
    ac();
    clearTimers(); gen++;
    mode = 'game'; level = 0; score = 0; lives = MAX_LIVES;
    $('#lives').hidden = false; $('#starsBox').hidden = false;
    $('#hintCost').hidden = false;
    $('#playBar').hidden = false; $('#freeBar').hidden = true;
    renderHearts(); renderScore();
    show('game');
    startLevel();
  }

  function startLevel() {
    queue = pickWords(level); wordIdx = 0;
    renderLevel();
    banner(`Niveau ${level + 1}`, LEVELS[level].title, () => startWord());
    sfx.level();
    speak(`Niveau ${level + 1}`);
  }

  function startWord() {
    clearTimers(); gen++;
    const [w, emoji] = mode === 'game' ? queue[wordIdx] : current;
    current = [w, emoji];
    wordErrors = 0;
    renderLevel();
    say('');
    $('#cursiveWord').hidden = true;
    const pic = $('#picto'); pic.textContent = emoji || '';
    pic.classList.remove('bounce'); void pic.offsetWidth; pic.classList.add('bounce');
    build(cleanWord(w));
    setControls(true);
    later(() => speak(w), 250);
    showThenMix(1800);
  }

  function onError() {
    wordErrors++;
    if (mode === 'game') {
      lives--;
      renderHearts(true);
      if (lives <= 0) { phase = 'over'; setControls(false); later(() => endGame(false), 1100); return; }
    }
    if (wordErrors >= ERRORS_BEFORE_MIX) {
      wordErrors = 0;
      phase = 'reshuffle';
      say('Deux erreurs : on remélange le mot !', 'bad');
      later(() => {
        const my = gen;
        tiles.forEach(t => { t.busy = false; t.el.classList.remove('shake', 'wrong', 'dragging'); });
        speak(current[0]);
        showThenMix(1600);
        later(() => { if (my === gen) say(''); }, 3000);
      }, 900);
    } else {
      say(mode === 'game' ? 'Attention : encore une erreur et le mot se remélange.' : 'Pas là ! Essaie une autre lettre.', 'bad');
    }
  }

  function checkWin() {
    if (!slots.every(s => s.filled)) return;
    phase = 'won';
    setControls(false);
    const my = gen;
    tiles.forEach((t, k) => setTimeout(() => { t.el.classList.remove('pop'); void t.el.offsetWidth; t.el.classList.add('pop'); }, k * 90));
    sfx.win(); confetti();
    later(() => speak(current[0]), 400);
    if (state.script !== 'print') { $('#cursiveWord').textContent = cursiveText(word); $('#cursiveWord').hidden = false; }
    if (mode === 'free') { say('Bravo !', 'good'); $('#freeBar').hidden = false; return; }
    const gain = level + 1;
    score += gain; renderScore();
    floatText(`+${gain} ⭐`, $('#starsBox'), 'plus');
    say('Bravo !', 'good');
    later(() => { if (my === gen) nextWord(); }, 2600);
  }

  function nextWord() {
    wordIdx++;
    if (wordIdx < queue.length) { startWord(); return; }
    level++;
    if (level >= LEVELS.length) { endGame(true); return; }
    clearTimers(); gen++;
    startLevel();
  }

  function endGame(won) {
    clearTimers(); gen++; phase = 'idle';
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const reached = Math.min(level + 1, LEVELS.length);
    const entry = { name: state.name, score, level: reached, done: won, t: Date.now() };
    state.scores.push(entry);
    state.scores.sort((a, b) => b.score - a.score || b.level - a.level || a.t - b.t);
    state.scores = state.scores.slice(0, 10);
    save();
    const rank = state.scores.indexOf(entry);
    $('#endEmoji').textContent = won ? '🏆' : '💔';
    $('#endTitle').textContent = won ? `Bravo ${state.name} !` : 'Plus de chances !';
    $('#endText').textContent = won ? 'Tu as réussi les 10 niveaux.' : `${state.name}, tu es arrivé au niveau ${reached}.`;
    $('#endScore').textContent = score;
    $('#endRank').textContent = rank >= 0 ? (rank === 0 ? 'Nouveau record ! Tu es premier du classement.' : `Tu es ${rank + 1}e du classement.`) : 'Pas assez pour entrer dans le classement cette fois.';
    renderScores($('#endScores'), entry);
    show('end');
    if (won) { sfx.win(); confetti(); speak(`Bravo ${state.name}`); } else { sfx.lose(); }
  }

  function startFree() {
    const chars = cleanWord($('#freeInput').value);
    if (chars.length < 2) { $('#freeMsg').textContent = 'Écris un mot d\'au moins 2 lettres.'; return; }
    $('#freeMsg').textContent = '';
    ac(); clearTimers(); gen++;
    mode = 'free'; current = [$('#freeInput').value.trim(), ''];
    $('#lives').hidden = true; $('#starsBox').hidden = true;
    $('#hintCost').hidden = true;
    $('#playBar').hidden = false; $('#freeBar').hidden = true;
    $('#lvlLabel').textContent = 'Mot libre';
    show('game');
    startWord();
  }

  function goHome() {
    clearTimers(); gen++; phase = 'idle';
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    $('#nameInput').value = state.name || '';
    renderScores($('#homeScores'));
    show('home');
  }

  /* ----- Indice ----- */
  function hint() {
    if (phase !== 'play') return;
    const empty = slots.map((s, i) => s.filled ? -1 : i).filter(i => i >= 0);
    if (!empty.length) return;
    const i = empty[Math.floor(Math.random() * empty.length)];
    const t = tiles.find(t => t.slot === null && !t.busy && t.ch === slots[i].ch);
    if (!t) return;
    sfx.hint();
    if (mode === 'game') {
      if (score > 0) { score--; renderScore(); }
      const sb = $('#starsBox'); sb.classList.remove('hit'); void sb.offsetWidth; sb.classList.add('hit');
      floatText('−1 ⭐', sb, 'minus');
    }
    lockIn(t, i);
    checkWin();
  }

  /* ================= AFFICHAGE ================= */
  function renderLevel() {
    if (mode !== 'game') return;
    const dots = queue.map((_, k) => `<i class="${k < wordIdx ? 'done' : k === wordIdx ? 'now' : ''}"></i>`).join('');
    $('#lvlLabel').innerHTML = `Niveau ${level + 1} / ${LEVELS.length} <small style="font-size:.6em;opacity:.7">· mot ${wordIdx + 1} / ${queue.length}</small><span class="dots" aria-label="Mot ${wordIdx + 1} sur ${queue.length}">${dots}</span>`;
  }
  function renderScore() { $('#stars').textContent = score; }
  function renderHearts(animate) {
    const h = $('#hearts');
    if (h.children.length !== MAX_LIVES) h.innerHTML = Array.from({ length: MAX_LIVES }, () => '<span class="heart">❤️</span>').join('');
    Array.from(h.children).forEach((el, k) => {
      const lost = k >= lives;
      if (animate && lost && !el.classList.contains('lost')) {
        el.classList.add('breaking');
        setTimeout(() => { el.classList.remove('breaking'); el.classList.add('lost'); }, 750);
      } else if (!el.classList.contains('breaking')) {
        el.classList.toggle('lost', lost);
      }
    });
    const c = $('#chances');
    c.innerHTML = lives > 1 ? `Il reste <b>${lives}</b> chances` : lives === 1 ? 'Il reste <b>1</b> chance' : 'Plus de chances';
    c.classList.toggle('low', lives <= 3);
  }
  function renderScores(list, highlight) {
    if (!state.scores.length) { list.innerHTML = '<li class="empty">Aucun score pour l\'instant. Joue une partie pour être le premier !</li>'; return; }
    const medals = ['🥇', '🥈', '🥉'];
    list.innerHTML = state.scores.map((s, k) =>
      `<li class="${s === highlight ? 'me' : ''}"><span class="rk">${medals[k] || (k + 1)}</span><span class="nm">${esc(s.name)}</span><span class="lv">${s.done ? '10 niveaux ✔' : 'niveau ' + s.level}</span><span class="pt">⭐ ${s.score}</span></li>`
    ).join('');
  }
  function say(text, kind) { const el = $('#say'); el.textContent = text; el.className = 'say' + (kind ? ' ' + kind : ''); }
  function setControls(on) { $('#hintBtn').disabled = !on; $('#listenBtn').disabled = false; }

  function floatText(text, anchor, cls) {
    const r = anchor.getBoundingClientRect();
    const f = document.createElement('div');
    f.className = 'float ' + cls; f.textContent = text;
    f.style.left = Math.max(8, Math.min(window.innerWidth - 110, r.left + r.width / 2 - 45)) + 'px';
    f.style.top = (r.bottom + 4) + 'px';
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1300);
  }

  function banner(big, small, done) {
    $('#bannerBig').textContent = big; $('#bannerSmall').textContent = small;
    $('#banner').hidden = false;
    const my = gen;
    later(() => { $('#banner').hidden = true; if (my === gen) done(); }, 2000);
  }

  /* ----- Confettis ----- */
  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = $('#confetti'), x = c.getContext('2d');
    c.width = innerWidth; c.height = innerHeight; c.style.display = 'block';
    const P = Array.from({ length: 120 }, () => ({
      x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5,
      vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3, r: 5 + Math.random() * 6,
      a: Math.random() * 6, c: COLORS[Math.floor(Math.random() * COLORS.length)]
    }));
    let f = 0;
    (function step() {
      x.clearRect(0, 0, c.width, c.height);
      P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); });
      if (++f < 150) requestAnimationFrame(step); else { x.clearRect(0, 0, c.width, c.height); c.style.display = 'none'; }
    })();
  }

  /* ----- Réglages ----- */
  function setCase(upper) {
    state.upper = upper; save();
    $$('.seg button[data-case]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.case === 'upper') === upper)));
  }
  function setScript(m) {
    state.script = m; save();
    board.dataset.script = m;
    $$('.seg button[data-script]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.script === m)));
  }
  function setSound(on) {
    state.sound = on; save();
    $$('.soundBtn').forEach(b => { b.textContent = on ? '🔊' : '🔇'; b.setAttribute('aria-label', on ? 'Couper le son' : 'Remettre le son'); });
    if (!on && 'speechSynthesis' in window) speechSynthesis.cancel();
  }

  /* ----- Événements ----- */
  $('#playBtn').addEventListener('click', startGame);
  $('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') startGame(); });
  $('#freeBtn').addEventListener('click', startFree);
  $('#freeInput').addEventListener('keydown', e => { if (e.key === 'Enter') startFree(); });
  $('#freeNewBtn').addEventListener('click', () => { goHome(); const d = $('details.free'); d.open = true; $('#freeInput').value = ''; $('#freeInput').focus(); });
  $('#hintBtn').addEventListener('click', hint);
  $('#listenBtn').addEventListener('click', () => { ac(); if (current) speak(current[0]); });
  $('#homeBtn').addEventListener('click', () => {
    if (mode === 'game' && !confirm('Arrêter la partie ? Le score ne sera pas enregistré.')) return;
    goHome();
  });
  $('#againBtn').addEventListener('click', () => { $('#nameInput').value = state.name; startGame(); });
  $('#toHomeBtn').addEventListener('click', goHome);
  $$('.seg button[data-case]').forEach(b => b.addEventListener('click', () => setCase(b.dataset.case === 'upper')));
  $$('.seg button[data-script]').forEach(b => b.addEventListener('click', () => setScript(b.dataset.script)));
  $$('.soundBtn').forEach(b => b.addEventListener('click', () => setSound(!state.sound)));
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (!$('#game').hidden && word.length) layout(true); }, 100); });

  /* ----- Démarrage ----- */
  setCase(state.upper);
  setScript(state.script);
  setSound(state.sound);
  goHome();

  // pour les tests
  window.__lv = { get tiles() { return tiles; }, get slots() { return slots; }, get phase() { return phase; }, get lives() { return lives; }, get score() { return score; }, get level() { return level; }, get word() { return current; } };
})();
</script>
</body>
</html>
